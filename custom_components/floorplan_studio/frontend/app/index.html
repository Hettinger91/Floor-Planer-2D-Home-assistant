<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Grundriss</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="mode-edit">
  <header id="top">
    <button id="btnSide" class="ibtn" title="Menü von Home Assistant" hidden>☰</button>
    <button id="btnLib" class="ibtn only-mobile" title="Objekte">☰</button>
    <div class="brand"><span class="logo">⌂</span><b>Grundriss</b></div>
    <nav id="floors"></nav>
    <div class="grow"></div>
    <span id="saveState" class="savestate" title="Speicherstatus"><i></i><span>–</span></span>
    <span id="haBadge" class="badge" hidden></span>
    <button id="btnUndo" class="ibtn" title="Rückgängig (Strg+Z)">↶</button>
    <button id="btnRedo" class="ibtn" title="Wiederholen (Strg+Y)">↷</button>
    <div class="seg"><button id="modeEdit" class="on">Bearbeiten</button><button id="modeLive">Live</button></div>
    <button id="btnMenu" class="ibtn" title="Menü">⋯</button>
    <button id="btnInsp" class="ibtn only-mobile" title="Eigenschaften">⚙</button>
  </header>

  <aside id="left">
    <div class="tools" id="tools">
      <button data-tool="select" class="on" title="Auswählen (V)"><b>↖</b><span>Auswahl</span></button>
      <button data-tool="wall" title="Wand zeichnen (W)"><b>╱</b><span>Wand</span></button>
      <button data-tool="rect" title="Raum als Rechteck (R)"><b>▭</b><span>Raum</span></button>
      <button data-tool="room" title="Raum als Polygon (P)"><b>⬠</b><span>Polygon</span></button>
      <button data-tool="hand" title="Ansicht verschieben (H / Leertaste)"><b>✋</b><span>Hand</span></button>
    </div>
    <label class="chk small"><input type="checkbox" id="optRectWalls"> Rechteckraum mit Wänden</label>
    <div class="seg" id="leftTabs"><button id="tabObj" class="on">Objekte</button><button id="tabEnt">Entitäten</button></div>
    <div id="objPane">
      <div class="lib-head">
        <input id="libSearch" type="search" placeholder="Objekte suchen …">
        <button id="btnNewType" class="mini" title="Eigenes Objekt anlegen">+ Eigenes</button>
      </div>
      <div id="library"></div>
    </div>
    <div id="entPane" hidden></div>
  </aside>

  <main id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs><filter id="fpShadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".3"/></filter></defs>
      <defs id="glowDefs"></defs>
      <g id="world">
        <g id="gridL"></g><g id="bgL"></g><g id="roomsL"></g><g id="wallsL"></g><g id="itemsL"></g><g id="overlayL"></g>
      </g>
    </svg>
    <div id="hint"></div>
    <div id="empty" hidden>
      <h2>Neuer Grundriss</h2>
      <p>Zeichne Wände oder einen Raum – oder lege ein Bild deines Grundrisses als Vorlage darunter.</p>
      <div class="row">
        <button class="btn primary" id="emptyRect">Raum zeichnen</button>
        <button class="btn" id="emptyWall">Wände zeichnen</button>
        <button class="btn" id="emptyBg">Bild als Vorlage</button>
      </div>
    </div>
    <div id="hud">
      <div id="drawBar" hidden>
        <button class="btn primary" id="btnFinish">Fertig</button>
        <button class="btn" id="btnCancel">Abbrechen</button>
      </div>
      <div class="zoom">
        <button id="zoomOut" class="ibtn">−</button>
        <button id="rotL" class="ibtn" title="Ansicht drehen (Q, Rechtsklick-Ziehen, Shift+Mausrad, zwei Finger)">⟲</button>
        <button id="orbit" class="ibtn" title="Dreh-Modus: Ziehen mit einem Finger / der Maus dreht die Ansicht">◎</button>
        <button id="zoomFit" class="ibtn" title="Alles anzeigen">⤢</button>
        <button id="rotR" class="ibtn" title="Ansicht drehen (E)">⟳</button>
        <button id="zoomIn" class="ibtn">+</button>
      </div>
    </div>
    <div id="status"></div>
  </main>

  <aside id="right"><div id="inspector"></div></aside>
  <div id="scrim"></div>
</div>
<datalist id="entlist"></datalist>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<input type="file" id="fileAny" hidden>

<script src="js/util.js"></script>
<script src="js/host.js"></script>
<script src="js/library.js"></script>
<script src="js/symbols.js"></script>
<script src="js/model.js"></script>
<script src="js/ha.js"></script>
<script src="js/render.js"></script>
<script src="js/tools.js"></script>
<script src="js/entities.js"></script>
<script src="js/inspector.js"></script>
<script src="js/main.js"></script>
</body>
</html>
